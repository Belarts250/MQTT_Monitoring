<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Temperature Dashboard</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0/dist/chartjs-adapter-moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-streaming@2.0.0/dist/chartjs-plugin-streaming.min.js"></script>

<style>
:root {
    --primary: #401328;
    --background: #FFFFED;
    --card: #fffdf4;
    --border: rgba(64, 19, 40, 0.15);
    --text-main: #2b0d1b;
    --text-muted: rgba(64, 19, 40, 0.65);
    --glow: rgba(64, 19, 40, 0.35);
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #FFFFED 0%, #fff9dc 100%);
    color: var(--text-main);
}

.app { max-width: 1200px; margin: auto; padding: 32px 24px 48px; }

header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 36px; }
header h1 { font-size: 1.8rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 12px; }

.status { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 0 20px var(--glow); font-size: 0.85rem; font-weight: 600; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 12px var(--primary); }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-bottom: 36px; }

.card { background: var(--card); border-radius: 20px; padding: 26px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(64, 19, 40, 0.12); display: flex; flex-direction: column; }

.card-title { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }

.metric { font-size: 3.2rem; font-weight: 700; color: var(--primary); }
.unit { font-size: 1.4rem; opacity: 0.6; }
.meta { margin-top: auto; display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

.chart-card { margin-top: 20px; background: radial-gradient(circle at top, rgba(64,19,40,0.15), transparent 60%); }
.chart-wrapper { height: 380px; width: 100%; }
.chart-wrapper canvas { width: 100% !important; height: 100% !important; }

.last-update { margin-top: 20px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
</style>
</head>

<body>
<div class="app">

<header>
    <h1><i class="bi bi-wifi"></i> Temperature Monitor</h1>
    <div class="status" id="status-container">
        <div class="status-dot" id="status-dot"></div>
        <span id="mqtt-status-text">Connecting...</span>
    </div>
</header>

<section class="metrics">
    <div class="card">
        <div class="card-title"><i class="bi bi-thermometer-half"></i> Temperature</div>
        <div class="metric"><span id="temperature">--</span><span class="unit">°C</span></div>
        <div class="meta"><span>DHT11 Sensor</span><span id="ts-temp">Waiting…</span></div>
    </div>

    <div class="card">
        <div class="card-title"><i class="bi bi-moisture"></i> Humidity</div>
        <div class="metric"><span id="humidity">--</span><span class="unit">%</span></div>
        <div class="meta"><span>DHT11 Sensor</span><span id="ts-hum">Waiting…</span></div>
    </div>
</section>

<section class="card chart-card">
    <div class="card-title"><i class="bi bi-activity"></i> Live Temperature Chart</div>
    <div class="chart-wrapper">
        <canvas id="sensor-chart"></canvas>
    </div>
</section>

<div class="last-update" id="last-update">Waiting for data...</div>

</div>

<script>
// ------------------- MQTT SETTINGS (MATCH YOUR SETUP) -------------------
const broker = "157.173.101.159";  // Your VPS IP
const port = 9001;                 // WebSocket port (needs to be configured in Mosquitto)
const clientId = "web_" + Math.random().toString(16).substr(2, 8);

// Create MQTT client
const client = new Paho.MQTT.Client(broker, port, clientId);

// Connection status
let isConnected = false;

client.onConnectionLost = function(responseObject) {
    isConnected = false;
    document.getElementById("mqtt-status-text").innerText = "Disconnected";
    document.getElementById("status-dot").style.background = "red";
    document.getElementById("status-dot").style.boxShadow = "0 0 12px red";
};

client.onMessageArrived = function(message) {
    const now = Date.now();
    const payload = message.payloadString;
    
    
    if (message.destinationName === "sensor/temperature") {
        const temp = parseFloat(payload);
        if (!isNaN(temp)) {
            document.getElementById("temperature").innerText = temp.toFixed(1);
            document.getElementById("ts-temp").innerText = new Date(now).toLocaleTimeString();
            
            // Update chart with temperature
            sensorChart.data.datasets[0].data.push({ x: now, y: temp });
            
            // Also update last update time
            document.getElementById("last-update").innerHTML = `📡 Last update: ${new Date(now).toLocaleTimeString()}`;
        }
    }
    
    if (message.destinationName === "sensor/humidity") {
        const hum = parseFloat(payload);
        if (!isNaN(hum)) {
            document.getElementById("humidity").innerText = hum.toFixed(0);
            document.getElementById("ts-hum").innerText = new Date(now).toLocaleTimeString();
            
            // Update chart with humidity
            sensorChart.data.datasets[1].data.push({ x: now, y: hum });
        }
    }
};

// Connect to MQTT broker
client.connect({
    useSSL: false,
    timeout: 3,
    onSuccess: function() {
        isConnected = true;
        document.getElementById("mqtt-status-text").innerText = "✅ Live Connected";
        document.getElementById("status-dot").style.background = "#00ff00";
        document.getElementById("status-dot").style.boxShadow = "0 0 12px #00ff00";
        
        // Subscribe to your topics
        client.subscribe("sensor/temperature");
        client.subscribe("sensor/humidity");
        
        console.log("Connected to MQTT broker!");
    },
    onFailure: function() {
        document.getElementById("mqtt-status-text").innerText = "❌ Connection Failed";
        document.getElementById("status-dot").style.background = "red";
        document.getElementById("status-dot").style.boxShadow = "0 0 12px red";
        console.log("Failed to connect to MQTT broker");
    }
});

// ------------------- CHART -------------------
const ctx = document.getElementById("sensor-chart").getContext("2d");

// Gradients
const gradientTemp = ctx.createLinearGradient(0, 0, 0, 380);
gradientTemp.addColorStop(0, "rgba(255,87,51,0.4)");
gradientTemp.addColorStop(1, "rgba(255,87,51,0)");

const gradientHum = ctx.createLinearGradient(0, 0, 0, 380);
gradientHum.addColorStop(0, "rgba(51,123,255,0.4)");
gradientHum.addColorStop(1, "rgba(51,123,255,0)");

const sensorChart = new Chart(ctx, {
    type: "line",
    plugins: [ChartStreaming],
    data: {
        datasets: [
            { 
                label: "Temperature (°C)", 
                data: [], 
                borderColor: "#FF5733", 
                backgroundColor: gradientTemp, 
                fill: true, 
                pointRadius: 2,
                tension: 0.3 
            },
            { 
                label: "Humidity (%)", 
                data: [], 
                borderColor: "#337BFF", 
                backgroundColor: gradientHum, 
                fill: true, 
                pointRadius: 2,
                tension: 0.3 
            }
        ]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'nearest', intersect: false },
        scales: {
            x: { 
                type: "realtime", 
                realtime: { 
                    duration: 20000, 
                    refresh: 1000, 
                    delay: 1000 
                }, 
                title: { display: true, text: "Time" } 
            },
            y: { 
                beginAtZero: true,
                title: { display: true, text: "Value" }
            }
        },
        plugins: { 
            legend: { position: "top" } 
        }
    }
});
</script>

</body>
</html>
